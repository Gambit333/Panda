<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión · Sistema de Nómina</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6fa;
            color: #1f2937;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e5e7eb; }
            .card { background: #1e293b !important; border-color: #334155 !important; }
            button { background: #7c3aed !important; }
        }
        .card {
            max-width: 22rem;
            padding: 2rem 1.5rem;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
        }
        h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
        p { margin: 0 0 1.25rem; font-size: .95rem; opacity: .8; line-height: 1.5; }
        button {
            border: 0;
            color: #fff;
            padding: .7rem 1.4rem;
            border-radius: .5rem;
            font-size: .95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sin conexión</h1>
        <p>Esta página necesita internet. Revisa tu conexión y vuelve a intentarlo; los datos no se guardan en el teléfono.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
